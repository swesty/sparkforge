[package]
name = "sparkforge"
version = "0.1.0"
edition = "2021"
description = "Model-specialized LLM inference engine for NVIDIA DGX Spark (GB10 / SM121)"
license = "Apache-2.0"

[features]
default = []
# Enables NVRTC compilation + kernel loading on a real GB10. Builds without a CUDA install
# because cudarc loads libcuda/libnvrtc dynamically at runtime.
cuda = ["dep:cudarc"]

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# `asm`: the hardware SHA256 backend (2.14 GB/s on GB10 against 0.57 GB/s without), used to verify
# Hugging Face cache blobs on every load from a cache.
sha2 = { version = "0.10", features = ["asm"] }
# Hugging Face cache blobs: LFS files are named by SHA256 of the content, others by the Git object SHA1.
sha1 = "0.10"
# O_NONBLOCK / O_NOFOLLOW for shard and lock opens, geteuid for the per-user lock directory.
libc = "0.2"
cudarc = { version = "0.17", optional = true, default-features = false, features = ["std", "driver", "nvrtc", "dynamic-loading", "cuda-13000"] }
