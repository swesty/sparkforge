# Generated by Code Factory policy; do not edit by hand. Enrolled repositories run the
# registry-hash-pinned verification entry point on every pull request, so the contract
# executes regardless of which machine authored the commit. The job name is the status
# context (verify) that `repo_policy.py configure-verify-check` makes required
# where the GitHub plan supports required checks.
#
# The job verifies GitHub's merge candidate -- the pull request merged into its base -- not the
# head commit in isolation. That is the tree the merge would produce, so a green check means the
# merge does not redden the default branch. Verifying the head alone would let two pull requests
# each pass against an older base and still leave the base broken once both land.
#
# It also runs on a push to the default branch, because a pull-request result only describes the
# merge candidate at the time it ran and says nothing about the base after a later merge. Both
# default-branch names are listed: the fleet uses main and master between its repositories, and
# this workflow is deliberately parameter-free so the policy audit can compare it to one string.
name: verify

on:
  pull_request:
  push:
    branches:
      - main
      - master

# The job executes pull-request-controlled code, so it gets the least privilege that
# still lets it read the tree. Without this the job inherits the repository default, which
# on many repositories is read/write.
permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the merge candidate
        uses: actions/checkout@v4
        with:
          # No `ref`: on pull_request, actions/checkout resolves refs/pull/N/merge, which is the
          # tree the merge would produce. That is what the check is asserting about.
          #
          # actions/checkout writes its token into .git/config by default, and the verifier this
          # job runs comes from pull-request-controlled content, so that token must not be there.
          persist-credentials: false
      - name: Install the OpenSpec CLI (pinned)
        run: npm install -g @fission-ai/openspec@1.6.0
      - name: Run the repository verification contract
        run: |
          set -euo pipefail
          ./tools/code-factory/verify.sh
